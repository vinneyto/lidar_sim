[project]
name = "gs-lidar"
version = "0.1.0"
description = "Virtual LiDAR for 3D Gaussian Splatting scenes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "course-3dgs",
    "torch>=2.12.1",
    "plyfile>=1.1",
    "rerun-sdk>=0.22",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gs_lidar", "src/metal_sift"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
course-3dgs = { git = "https://github.com/vinneyto/course_3dgs", rev = "40f0b7e973cd5c9df2528edb281386b7b0ca4408" }
