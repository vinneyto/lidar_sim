[project]
name = "gs-lidar"
version = "0.1.0"
description = "Virtual LiDAR for 3D Gaussian Splatting scenes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.5", "plyfile>=1.1", "rerun-sdk>=0.22"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gs_lidar"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
