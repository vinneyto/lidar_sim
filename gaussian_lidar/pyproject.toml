[project]
name = "gaussian-lidar"
version = "0.1.0"
description = "Metal-accelerated LiDAR simulation over Gaussian splat PLY files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gaussforge @ git+https://github.com/3dgscloud/GaussForge.git",
  "torch>=2.7",
  "websockets>=13.0",
]

[project.optional-dependencies]
rabbitmq = ["aio-pika>=9.4"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
gaussian-lidar = "gaussian_lidar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/gaussian_lidar"]

[tool.hatch.build.targets.wheel.force-include]
"src/gaussian_lidar/frontend" = "gaussian_lidar/frontend"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
